<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Absen Musyrif</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Aplikasi absensi santri untuk musyrif: shalat, makan, keterlambatan, dan kegiatan wajib pondok.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Absen Musyrif">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f3f6f5;--card:#fff;--ink:#12201d;--mut:#667873;--line:#dde6e3;--pri:#0f766e;--prit:#fff;--H:#16a34a;--T:#d97706;--I:#2563eb;--S:#9333ea;--A:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#17211f;--ink:#e8f1ee;--mut:#8fa59f;--line:#26342f;--pri:#2dd4bf;--prit:#042f2a}}
:root[data-theme="dark"]{--bg:#0e1514;--card:#17211f;--ink:#e8f1ee;--mut:#8fa59f;--line:#26342f;--pri:#2dd4bf;--prit:#042f2a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
#app{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-weight:600}
.chip.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.chip small{display:block;font-weight:400;opacity:.75;font-size:11px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:var(--prit);border:0;border-radius:10px;padding:11px 14px;font-weight:700}
.btn.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.ic{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;color:var(--ink);font-size:18px}
.sum{display:flex;gap:6px;margin:6px 0 10px}
.sum div{flex:1;text-align:center;border-radius:10px;padding:6px 0;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.sum b{display:block;font-size:18px;color:var(--ink)}
.name{font-weight:700}.mut{color:var(--mut);font-size:12px}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.st button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 0;font-weight:700;font-size:13px}
.st button.on{color:#fff;border-color:transparent}
.st button.on[data-s=H]{background:var(--H)}.st button.on[data-s=T]{background:var(--T)}.st button.on[data-s=I]{background:var(--I)}.st button.on[data-s=S]{background:var(--S)}.st button.on[data-s=A]{background:var(--A)}
.extra{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.extra input{flex:1;min-width:120px}.mn{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}.mn.on{background:var(--T);color:#fff;border-color:var(--T)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mut);font-size:12px;font-weight:600}nav button.on{color:var(--pri)}nav span{display:block;font-size:20px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.nm{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-align:left;text-decoration:underline dotted var(--mut);text-underline-offset:3px}
.fl{display:inline-block;margin:4px 4px 0 0;padding:2px 8px;border-radius:999px;background:rgba(217,119,6,.16);color:var(--T);font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
<button data-a="tab" data-v="absen"><span>✅</span>Absen</button>
<button data-a="tab" data-v="rekap"><span>📊</span>Rekap</button>
<button data-a="tab" data-v="santri"><span>👥</span>Santri</button>
<button data-a="tab" data-v="kon"><span>💬</span>Konseling</button>
<button data-a="tab" data-v="pengurus" id="nadm" style="display:none"><span>📋</span>Laporan</button>
</nav>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
const SL=[
{id:'tahajud',l:'Tahajud',g:'Shalat',t:3.5},{id:'subuh',l:'Subuh',g:'Shalat',t:4.5},{id:'dhuha',l:'Dhuha',g:'Shalat',t:7},{id:'dzuhur',l:'Dzuhur',g:'Shalat',t:12},{id:'ashar',l:'Ashar',g:'Shalat',t:15.25},{id:'maghrib',l:'Maghrib',g:'Shalat',t:18},{id:'isya',l:'Isya',g:'Shalat',t:19},
{id:'mpagi',l:'Makan Pagi',g:'Makan',t:6},{id:'msiang',l:'Makan Siang',g:'Makan',t:12.5},{id:'mmalam',l:'Makan Malam',g:'Makan',t:18.5},
{id:'tahfidz',l:'Tahfidz',g:'Kegiatan',t:5.25},{id:'kerja',l:'Kerja Bakti',g:'Kegiatan',t:7.5},{id:'olah',l:'Olahraga',g:'Kegiatan',t:16},{id:'muha',l:'Muhadharah',g:'Kegiatan',t:20},{id:'belajar',l:'Belajar Malam',g:'Kegiatan',t:20.5}];
const GR=['Shalat','Makan','Kegiatan'];
const ST=[['H','Hadir'],['T','Telat'],['I','Izin'],['S','Sakit'],['A','Alpa']];
let db={santri:[],rec:{},kon:[]};
let sb=null,cdb=false,me=null,role='',myName='',isAdm=false,isOwn=false,isPim=false,canW=true,view=null,vname='',mine=null,tm,loadedFrom='',pushing=false,again=false,last={s:{},r:{},k:{}};
const WIN=62,CFG=window.APP_CONFIG||{};
const ro=()=>!!view||isAdm;
const flatS=()=>{const o={};db.santri.forEach(s=>o[s.id]=JSON.stringify([s.name,s.room||'']));return o};
const flatR=(rec=db.rec)=>{const ok=new Set(db.santri.map(s=>s.id)),o={};for(const k in rec){const[d,sl]=k.split('|');for(const id in rec[k]){if(!ok.has(id))continue;const x=rec[k][id];o[d+'|'+sl+'|'+id]=JSON.stringify([x.s,x.m||0,x.n||''])}}return o};
const flatK=()=>{const ok=new Set(db.santri.map(s=>s.id)),o={};(db.kon||[]).forEach(k=>{if(ok.has(k.sid))o[k.id]=JSON.stringify([k.sid,k.tgl,k.topik,k.cat,k.tl||'',k.tld||'',k.st,!!k.esk])});return o};
const save=()=>{if(ro())return;clearTimeout(tm);tm=setTimeout(push,500)};
const chk=r=>{if(r.error)throw r.error};
async function push(){if(ro()||!sb)return;if(pushing){again=true;return}pushing=true;clearTimeout(tm);
try{const cs=flatS(),cr=flatR(),ck=flatK();
const up=db.santri.filter(s=>cs[s.id]!==last.s[s.id]).map(s=>({id:s.id,musyrif_id:me,nama:s.name,kamar:s.room||''}));
if(up.length)chk(await sb.from('santri').upsert(up));
const gone=new Set(Object.keys(last.s).filter(id=>!(id in cs)));
if(gone.size)chk(await sb.from('santri').delete().in('id',[...gone]));
const ur=[];for(const k in cr)if(cr[k]!==last.r[k]){const[tg,sl,id]=k.split('|'),[s,m,n]=JSON.parse(cr[k]);ur.push({santri_id:id,musyrif_id:me,tanggal:tg,slot:sl,status:s,menit:m,catatan:n})}
for(let i=0;i<ur.length;i+=500)chk(await sb.from('absensi').upsert(ur.slice(i,i+500),{onConflict:'santri_id,tanggal,slot'}));
const dg={};for(const k in last.r)if(!(k in cr)){const[tg,sl,id]=k.split('|');if(gone.has(id))continue;(dg[tg+'|'+sl]=dg[tg+'|'+sl]||[]).push(id)}
for(const g in dg){const[tg,sl]=g.split('|');for(let i=0;i<dg[g].length;i+=100)chk(await sb.from('absensi').delete().eq('tanggal',tg).eq('slot',sl).in('santri_id',dg[g].slice(i,i+100)))}
const uk=(db.kon||[]).filter(k=>ck[k.id]&&ck[k.id]!==last.k[k.id]).map(k=>({id:k.id,santri_id:k.sid,musyrif_id:me,tanggal:k.tgl,topik:k.topik,catatan:k.cat,tindak_lanjut:k.tl||null,tanggal_tl:k.tld||null,status:k.st,eskalasi:!!k.esk}));
if(uk.length)chk(await sb.from('konseling').upsert(uk));
const dk=Object.keys(last.k).filter(id=>!(id in ck));
if(dk.length)chk(await sb.from('konseling').delete().in('id',dk));
last={s:cs,r:cr,k:ck}}catch(e){toast('Gagal menyimpan: '+(e.message||'cek koneksi'))}
finally{pushing=false;if(again){again=false;push()}}}
window.addEventListener('online',()=>push());
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ds(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const now=new Date(),hr=now.getHours()+now.getMinutes()/60;
const autoSlot=()=>{const a=SL.filter(x=>x.g==='Shalat'&&x.t<=hr);return a.length?a[a.length-1].id:'subuh'};
const ui={tab:'absen',date:ds(now),grp:'Shalat',slot:autoSlot(),room:'',from:addD(ds(now),-6),to:ds(now),rg:'Shalat'};
const rooms=()=>[...new Set(db.santri.map(s=>s.room).filter(Boolean))].sort();
ui.room=rooms()[0]||'';ui.rrm='';
const key=()=>ui.date+'|'+ui.slot;
const recs=()=>db.rec[key()]||(db.rec[key()]={});
const list=()=>db.santri.filter(s=>!ui.room||s.room===ui.room);
let toastT;const toast=m=>{document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),1800)};

function absen(){
const r=recs(),L=list(),slots=SL.filter(x=>x.g===ui.grp),FW=agg(addD(ds(now),-6),ds(now));
const c={H:0,T:0,I:0,S:0,A:0};let f=0;L.forEach(s=>{const x=r[s.id];if(x){c[x.s]++;f++}});
return `<h1>Absen Musyrif</h1>
<div class="card"><div class="row"><button class="ic" data-a="dd" data-v="-1">‹</button><input type="date" id="dt" value="${ui.date}"><button class="ic" data-a="dd" data-v="1">›</button></div>
<div class="mut" style="margin-top:6px;text-align:center">${fmtD(ui.date)}</div></div>
<div class="chips">${GR.map(g=>`<button class="chip ${g===ui.grp?'on':''}" data-a="grp" data-v="${g}">${g}</button>`).join('')}</div>
<div class="chips">${slots.map(x=>`<button class="chip ${x.id===ui.slot?'on':''}" data-a="slot" data-v="${x.id}">${x.l}</button>`).join('')}</div>
<div class="chips">${rooms().map(x=>{const m=db.santri.filter(s=>s.room===x),d=m.filter(s=>r[s.id]).length;return `<button class="chip ${x===ui.room?'on':''}" data-a="room" data-v="${esc(x)}">${esc(x)}<small>${d}/${m.length}${d===m.length&&m.length?' ✓':''}</small></button>`}).join('')}<button class="chip ${!ui.room?'on':''}" data-a="room" data-v="">Semua<small>${db.santri.filter(s=>r[s.id]).length}/${db.santri.length}</small></button></div>
<button class="btn" data-a="allH" style="width:100%">Semua Hadir${ui.room?' · '+esc(ui.room):''}</button>
<div class="sum">${ST.map(([k,l])=>`<div>${l}<b style="color:var(--${k})">${c[k]}</b></div>`).join('')}</div>
<div class="mut">${f}/${L.length} santri terisi · tersimpan otomatis</div><div class="bar"><i style="width:${L.length?f/L.length*100:0}%"></i></div><div style="height:10px"></div>
${L.map(s=>{const x=r[s.id];return `<div class="card"><div class="row sp"><div><button class="nm" data-a="prof" data-id="${s.id}">${esc(s.name)}</button><div class="mut">${esc(s.room||'')}</div>${fchips(flags(FW[s.id]))}</div></div>
<div class="st">${ST.map(([k,l])=>`<button data-a="set" data-id="${s.id}" data-s="${k}" class="${x&&x.s===k?'on':''}">${l}</button>`).join('')}</div>
${x&&x.s!=='H'?`<div class="extra">${x.s==='T'?[5,10,15,30].map(m=>`<button class="mn ${x.m===m?'on':''}" data-a="min" data-id="${s.id}" data-v="${m}">${m} mnt</button>`).join(''):''}<input data-note="${s.id}" placeholder="Catatan (opsional)" value="${esc(x.n||'')}"></div>`:''}</div>`}).join('')||'<div class="card mut">Belum ada santri. Tambahkan di tab Santri.</div>'}`}

function rekap(){
const sl=new Set(SL.filter(x=>x.g===ui.rg).map(x=>x.id));const t={};
db.santri.forEach(s=>t[s.id]={H:0,T:0,I:0,S:0,A:0,m:0});
Object.entries(db.rec).forEach(([k,v])=>{const[d,sid]=k.split('|');if(d<ui.from||d>ui.to||!sl.has(sid))return;for(const id in v)if(t[id]){t[id][v[id].s]++;t[id].m+=v[id].m||0}});
const rows=db.santri.filter(s=>!ui.rrm||s.room===ui.rrm).map(s=>({s,...t[s.id]}));
return `<h1>Rekap</h1>${attn()}<div class="card"><div class="row"><input type="date" id="rf" value="${ui.from}"><input type="date" id="rt" value="${ui.to}"></div></div>
<div class="chips">${GR.map(g=>`<button class="chip ${g===ui.rg?'on':''}" data-a="rg" data-v="${g}">${g}</button>`).join('')}</div>
<div class="chips"><button class="chip ${!ui.rrm?'on':''}" data-a="rrm" data-v="">Semua</button>${rooms().map(x=>`<button class="chip ${x===ui.rrm?'on':''}" data-a="rrm" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
<div class="card tw"><table><tr><th>Nama</th>${ST.map(([k,l])=>`<th style="color:var(--${k})">${k}</th>`).join('')}<th>Mnt</th></tr>
${rows.map(r=>`<tr><td><button class="nm" data-a="prof" data-id="${r.s.id}">${esc(r.s.name)}</button></td><td>${r.H}</td><td>${r.T}</td><td>${r.I}</td><td>${r.S}</td><td>${r.A}</td><td>${r.m}</td></tr>`).join('')}</table></div>
<div class="mut" style="margin-bottom:8px">H=Hadir, T=Telat, I=Izin, S=Sakit, A=Alpa, Mnt=total menit telat</div>
<button class="btn o" data-a="csv" style="width:100%">Salin rekap (CSV)</button>`}

function santri(){return `<h1>Data Santri</h1><div class="mut" style="margin-bottom:8px">${rooms().map(x=>x+': '+db.santri.filter(s=>s.room===x).length).join(' · ')} · total ${db.santri.length}</div>
<div class="card"><div class="name" style="margin-bottom:6px">Tambah santri</div><textarea id="ns" rows="4" placeholder="Satu baris satu santri:&#10;Nama, Kamar&#10;Contoh: Zaid Hamdan, Kamar 1"></textarea><button class="btn" data-a="add" style="width:100%;margin-top:8px">Tambahkan</button></div>
${[...db.santri].sort((a,b)=>(a.room||'').localeCompare(b.room||'')).map(s=>`<div class="card row sp"><div><div class="name">${esc(s.name)}</div><div class="mut">${esc(s.room||'-')}</div></div><button class="ic" data-a="del" data-id="${s.id}" aria-label="Hapus">🗑</button></div>`).join('')}
<button class="btn o" data-a="reset" style="width:100%">Hapus semua data absen</button>`}

async function fetchAbs(uid,from,to){const out=[];for(let p=0;;p+=1000){const{data,error}=await sb.from('absensi').select('santri_id,tanggal,slot,status,menit,catatan').eq('musyrif_id',uid).gte('tanggal',from).lte('tanggal',to).order('tanggal').order('slot').order('santri_id').range(p,p+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
const toRec=rows=>{const rec={};rows.forEach(r=>{const k=r.tanggal+'|'+r.slot;(rec[k]=rec[k]||{})[r.santri_id]={s:r.status,m:r.menit||0,n:r.catatan||''}});return rec};
async function loadSet(uid,from){const[a,k]=await Promise.all([sb.from('santri').select('id,nama,kamar').eq('musyrif_id',uid).order('kamar').order('nama'),sb.from('konseling').select('*').eq('musyrif_id',uid).order('tanggal',{ascending:false})]);chk(a);
const rows=await fetchAbs(uid,from,ds(now));
return{santri:a.data.map(s=>({id:s.id,name:s.nama,room:s.kamar||''})),rec:toRec(rows),kon:(k.data||[]).map(x=>({id:x.id,sid:x.santri_id,tgl:x.tanggal,topik:x.topik,cat:x.catatan||'',tl:x.tindak_lanjut||'',tld:x.tanggal_tl||'',st:x.status,esk:x.eskalasi}))}}
async function loadMus(){const{data,error}=await sb.from('profiles').select('id,nama').eq('role','musyrif').order('nama');if(error)throw error;ui.mus=data.map(p=>({id:p.id,name:p.nama||'Musyrif',me:false}))}
async function ensureFrom(f){if(!sb||!f||f>=loadedFrom)return;try{const rows=await fetchAbs(view||me,f,addD(loadedFrom,-1)),r=toRec(rows);for(const k in r)db.rec[k]=Object.assign(db.rec[k]||{},r[k]);loadedFrom=f;if(!view)Object.assign(last.r,flatR(r))}catch(e){toast('Gagal memuat data lama')}}
function loginView(msg){document.querySelector('nav').style.display='none';document.getElementById('app').innerHTML=`<div class="card" style="margin-top:10vh"><h1>Absen Musyrif</h1><div class="mut" style="margin-bottom:12px">Masuk dengan akun yang diberikan admin.</div><input id="em" type="email" placeholder="Email" autocomplete="username"><div style="height:8px"></div><input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><div style="height:12px"></div><button class="btn" data-a="login" style="width:100%">Masuk</button><div id="lerr" class="mut" style="margin-top:8px;color:var(--A)">${msg||''}</div></div>`}
async function doLogin(){const el=document.getElementById('lerr'),em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;if(!em||!pw){el.textContent='Isi email dan kata sandi.';return}el.textContent='Memproses…';const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){el.textContent='Email atau kata sandi salah.';return}await start(data.user)}
async function doLogout(){try{await sb.auth.signOut()}catch(e){}location.reload()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')doLogin()});
async function start(u){const A=document.getElementById('app');A.innerHTML='<div class="card mut">Memuat…</div>';document.querySelector('nav').style.display='';
try{me=u.id;const{data:p,error}=await sb.from('profiles').select('nama,role').eq('id',me).single();if(error)throw error;
role=p.role;myName=p.nama||u.email;isOwn=role==='admin';isPim=role==='pimpinan';isAdm=isOwn||isPim;cdb=true;
if(isAdm){db={santri:[],rec:{},kon:[]};await loadMus();ui.tab='pengurus'}
else{loadedFrom=addD(ds(now),-WIN);db=await loadSet(me,loadedFrom);last={s:flatS(),r:flatR(),k:flatK()}}
ui.room=rooms()[0]||'';render();if(isAdm)loadSum()}
catch(e){A.innerHTML='<div class="card"><div class="name">Gagal memuat data</div><div class="mut">'+esc(e.message||e)+'</div><button class="btn o" data-a="logout" style="margin-top:10px">Keluar</button></div>'}}
async function boot(){if(!CFG.url||!CFG.key||CFG.url.includes('GANTI')){document.querySelector('nav').style.display='none';document.getElementById('app').innerHTML='<div class="card"><div class="name">Konfigurasi belum diisi</div><div class="mut">Isi url dan kunci anon di file config.js, lalu deploy ulang.</div></div>';return}

const SM=Object.fromEntries(SL.map(x=>[x.id,x])),SN=Object.fromEntries(ST);
function agg(from,to){const t={};for(const k in db.rec){const[d,sl]=k.split('|');if(d<from||d>to||!SM[sl])continue;const g=SM[sl].g,r=db.rec[k];for(const id in r){const x=r[id],o=t[id]||(t[id]={G:{},days:{},ev:[]}),q=o.G[g]||(o.G[g]={H:0,T:0,I:0,S:0,A:0,m:0});q[x.s]++;q.m+=x.m||0;if(x.s==='S')o.days[d]=1;if(x.s!=='H')o.ev.push({d,sl,s:x.s,m:x.m||0,n:x.n||''})}}return t}
const sum=(o,gs)=>{const q={H:0,T:0,I:0,S:0,A:0,m:0};if(o)for(const g in o.G)if(!gs||gs.includes(g))for(const k in q)q[k]+=o.G[g][k];return q};

function flags(o){const f=[];if(!o)return f;const q=sum(o);if(q.T>=3)f.push('Sering telat '+q.T+'×');if(q.A>=2)f.push('Alpa '+q.A+'×');const dk=Object.keys(o.days).sort();let run=1,mx=dk.length?1:0;for(let i=1;i<dk.length;i++){run=addD(dk[i-1],1)===dk[i]?run+1:1;mx=Math.max(mx,run)}if(mx>=3)f.push('Sakit '+mx+' hari berturut');return f}

return `<button class='btn o' data-a='pback'>← Kembali</button><h1 style='margin-top:12px'>${esc(s.name)}</h1><div class='mut'>${esc(s.room||'')}</div><div style='margin:6px 0'>${fchips(flags(wk))}</div>

<div class='card'><div class='row sp'><div><div class='mut'>Kehadiran (di luar izin/sakit)</div><div style='font-size:30px;font-weight:800'>${pc==null?'-':pc+'%'}</div></div><div style='text-align:right'><div class='mut'>Tren vs ${P} hari sebelumnya</div><div class='name'>${tr}</div></div></div><div class='sum' style='margin-top:10px'>${ST.map(([k,l])=>`<div>${l}<b style='color:var(--${k})'>${q[k]}</b></div>`).join('')}</div><div class='mut'>Total telat: ${q.m} menit</div></div>
<div class='card tw'><table><tr><th>Kegiatan</th><th>Hadir %</th><th>T</th><th>A</th></tr>${GR.map(g=>{const x=sum(cur,[g]),p=pct(x);return `<tr><td>${g}</td><td>${p==null?'-':p+'%'}</td><td>${x.T}</td><td>${x.A}</td></tr>`}).join('')}</table></div>
<div class='card'><div class='name'>Riwayat telat / tidak hadir</div>${ev.length?ev.map(e=>`<div style='padding:8px 0;border-bottom:1px solid var(--line)'><b style='color:var(--${e.s})'>${SN[e.s]}</b> · ${esc(SM[e.sl].l)} <span class='mut'>${e.d}${e.m?' · '+e.m+' mnt':''}</span>${e.n?`<div class='mut'>${esc(e.n)}</div>`:''}</div>`).join(''):'<div class="mut" style="margin-top:4px">Tidak ada.</div>'}</div>${konProf(s)}`}
const KT=['Ibadah','Akhlak/Perilaku','Pertemanan','Akademik','Keluarga','Kesehatan/Emosi','Kedisiplinan','Lainnya'],KS=['Terbuka','Berjalan','Selesai'],kcol={Terbuka:'var(--T)',Berjalan:'var(--I)',Selesai:'var(--H)'};
